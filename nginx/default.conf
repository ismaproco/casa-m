server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;  # SPA fallback
    }

    # Explicitly deny PHP requests (you don't run PHP)
    location ~* \.php$ {
        return 404;
    }

    # Optional: block common WP probes if you never host WP
    location = /wp-login.php { return 404; }
    location ^~ /wp-admin/ { return 404; }
    location ^~ /wp-includes/ { return 404; }
}
